name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests (Pytest)
        run: |
          pip install -r app/requirements.txt pytest httpx
          python -m pytest -v

      - name: Secret Scan (Gitleaks)
        id: gitleaks
        if: always()
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/gitleaks/gitleaks:latest \
            detect --source="/src" --report-format="json" --report-path="/src/gitleaks-report.json" --verbose

      - name: SAST Code Scan (Semgrep)
        id: semgrep
        if: always()
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan --config=p/python --config=p/security-audit --metrics=off \
            --json --output=/src/semgrep-report.json --error /src

      - name: Build Docker Image
        if: always()
        run: docker build -t devsecops-demo:${{ github.sha }} .

      - name: Container Vulnerability Scan (Trivy)
        id: trivy
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" \
            aquasec/trivy:latest image \
            --format json --output /src/trivy-report.json \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            devsecops-demo:${{ github.sha }}

      - name: Run AI Security Triage Engine
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python security/ai_triage.py . triage-summary.md

      - name: Post Triage Comment on Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- devsecops-ai-triage -->';
            const report = fs.existsSync('triage-summary.md')
              ? fs.readFileSync('triage-summary.md', 'utf8')
              : '## DevSecOps AI Security Triage\n\nNo triage summary generated.';
            const body = `${marker}\n${report}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload Security JSON & Triage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            semgrep-report.json
            trivy-report.json
            triage-summary.md
          if-no-files-found: ignore

      - name: Enforce Security Gates
        if: always()
        run: |
          if [ "${{ steps.gitleaks.outcome }}" != "success" ] || \
             [ "${{ steps.semgrep.outcome }}" != "success" ] || \
             [ "${{ steps.trivy.outcome }}" != "success" ]; then
            echo "One or more security gates failed. Review the AI triage summary."
            exit 1
          fi
